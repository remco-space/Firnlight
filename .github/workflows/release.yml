name: Release

# Builds the distributable, ad-hoc-signed app (FR-10.2) and publishes it to
# GitHub Releases (FR-10.1), never gated behind a build step the user has to
# run themselves.
#
# Runs on GitHub's xcode-27 runner image (arm64 only), a public preview as of
# 2026-09 (see build.yml's header for the changelog link). The
# Xcode-selection step warns when the image's Xcode looks like a beta build,
# so a release cut on a beta toolchain is visible in the run log rather than
# silently shipped.
#
# Publishing is gated on the packaged app actually launching (FR-10.2), not
# on the build succeeding — see the verification step below.
#
# Ad-hoc signing (CODE_SIGN_IDENTITY=-, no team) is deliberate, not a
# shortcut: this project has no Developer ID and no notarization (see
# CLAUDE.md's Release process), so nothing here needs the maintainer's own
# signing certificate as a repository secret — a plain ad-hoc signature is
# exactly what a downloaded build already ships with today. Gatekeeper still
# blocks first launch either way (FR-10.2); that instruction is in the
# release body below, not worked around here.
#
# Triggered by pushing a tag of the form vMAJOR.MINOR.PATCH, matching
# MARKETING_VERSION (FR-8.9) — never released ahead of or behind what that
# build setting says (FR-10.3).

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch place data
        run: scripts/fetch-place-data.sh
        # See build.yml's identical step: without this, the published
        # release's Firnlight/PlaceData/ is empty and FR-5.14 is false for
        # every user who downloads it, silently (the build still succeeds).

      - name: Select Xcode 27
        run: |
          # See build.yml's "Select Xcode 27" step for why this resolves
          # symlinks and dedupes before picking the newest candidate.
          XCODE_PATH="$(
            find /Applications -maxdepth 1 -name 'Xcode_27*.app' -print0 \
              | xargs -0 -I{} readlink -f "{}" \
              | sort -u \
              | sort -V \
              | tail -1
          )"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 27.x found on this runner image (checked /Applications/Xcode_27*.app)"
            find /Applications -maxdepth 1 -iname "*xcode*"
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

          # See build.yml's "Select Xcode 27" step for the beta-build
          # heuristic; a release is exactly the case where this warning
          # matters most.
          BUILD="$(xcodebuild -version | awk '/^Build version/ { print $3 }')"
          if [[ "$BUILD" =~ ^[0-9]+[A-Z][0-9]{4,}[A-Za-z]?$ ]]; then
            echo "::warning::Releasing from Xcode build $BUILD, which looks like a beta by digit count (see build.yml's Select Xcode 27 step for the check). GitHub's xcode-27 image is a public preview."
          fi

      - name: Verify tag matches MARKETING_VERSION
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Belt-and-braces for FR-10.3: refuse to publish a release whose
          # tag disagrees with the version the built app will actually
          # report (Firnlight-Info.plist / About.swift read MARKETING_VERSION
          # back at runtime — see CLAUDE.md's versioning section).
          PROJECT_VERSION="$(xcodebuild -project Firnlight.xcodeproj -scheme Firnlight \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk -F' = ' '/ MARKETING_VERSION / { print $2; exit }')"
          EXPECTED_TAG="v${PROJECT_VERSION}"
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $TAG_NAME does not match MARKETING_VERSION $PROJECT_VERSION (expected tag $EXPECTED_TAG)"
            exit 1
          fi

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project Firnlight.xcodeproj -scheme Firnlight \
            -configuration Release -destination "platform=macOS" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APP_PATH="$(
            xcodebuild -project Firnlight.xcodeproj -scheme Firnlight -configuration Release \
              -showBuildSettings 2>/dev/null \
            | awk -F' = ' '
                / BUILT_PRODUCTS_DIR / { dir = $2 }
                / FULL_PRODUCT_NAME /   { name = $2 }
                END { if (dir && name) print dir "/" name }
            '
          )"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built app not found at $APP_PATH"
            exit 1
          fi
          ZIP_NAME="Firnlight-${TAG_NAME}.zip"
          # ditto, not zip: preserves the app bundle's resource forks and
          # extended attributes the way Finder's "Compress" does.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Verify the packaged app launches
        run: |
          # FR-10.2: "That it launches is verified before publishing, never
          # inferred from a successful build." A build that compiles and links
          # can still fail to open — a bad signature, a missing bundle
          # resource, a crash before the first frame — and every one of those
          # reaches the user as an app that does nothing when double-clicked.
          #
          # Verified against the zip this job is about to publish, unpacked
          # again, not against the build directory: the artifact is what the
          # user gets, and the round trip through ditto is itself part of what
          # could break the bundle.
          VERIFY_DIR="$(mktemp -d)"
          ditto -x -k "$ZIP_NAME" "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app inside $ZIP_NAME"
            exit 1
          fi

          # The ad-hoc signature has to survive packaging, or first launch
          # fails outright instead of with the one warning FR-10.2 admits.
          codesign --verify --strict --verbose=2 "$APP_PATH"

          # `open`, not the executable directly: this is the double-click the
          # user performs, including LaunchServices' own checks.
          open -a "$APP_PATH"
          BINARY="$APP_PATH/Contents/MacOS/$(defaults read "$APP_PATH/Contents/Info" CFBundleExecutable)"

          # Two questions, in order: did it come up at all, and was it still
          # up a moment later — a crash during launch would otherwise pass a
          # bare "did the process ever exist" check.
          for _ in $(seq 1 20); do
            if pgrep -f "$BINARY" > /dev/null; then break; fi
            sleep 1
          done
          if ! pgrep -f "$BINARY" > /dev/null; then
            echo "::error::The packaged app did not launch"
            ls -l ~/Library/Logs/DiagnosticReports 2>/dev/null || true
            exit 1
          fi
          sleep 10
          if ! pgrep -f "$BINARY" > /dev/null; then
            echo "::error::The packaged app launched and then exited before it could be used"
            ls -l ~/Library/Logs/DiagnosticReports 2>/dev/null || true
            exit 1
          fi
          echo "Launched and stayed up."

          # Nothing here grants Photos access, so the app is sitting on its
          # own authorization screen (FR-1.1) — which is exactly the first
          # thing a new user sees, and enough to prove it opens. Quit it so
          # the runner isn't left with a GUI app holding the session.
          pkill -f "$BINARY" || true

      - name: Extract changelog entry for this version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          # Pull the section between this version's heading and the next
          # "## [" heading out of CHANGELOG.md (FR-10.3: every release
          # carries a changelog entry the user can read before updating).
          # Prefix match, not exact: Keep a Changelog's own convention (see
          # CHANGELOG.md's preamble) is "## [X.Y.Z] - YYYY-MM-DD", and an
          # exact match against "## [X.Y.Z]" alone rejected that dated
          # heading on this project's first release.
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION (expected a '## [$VERSION]' heading)"
            exit 1
          fi
          # FR-10.2: the release itself must carry the one instruction that
          # clears Gatekeeper's "Apple cannot check it" block — a user who
          # downloads the zip from this page never sees the README. (printf,
          # not a heredoc: a heredoc body inside this YAML block scalar would
          # keep its indentation and render as a markdown code block.)
          printf '%s\n' \
            '' \
            '---' \
            '' \
            '**First launch:** macOS will say it "cannot check Firnlight for malicious software" — this build is not notarized. Right-click Firnlight.app and choose **Open** (once), or run `xattr -cr Firnlight.app`.' \
            >> release-notes.md

      - name: Publish release
        env:
          TAG_NAME: ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: release-notes.md
          files: ${{ env.ZIP_NAME }}
