name: Build

# Regression check: the project must compile against the SDK generation users
# run it on. Signing is disabled here on purpose — this verifies the app
# compiles, not that it can be distributed (that is release.yml, FR-10.2).
#
# DORMANT — manual dispatch only. The app targets macOS/iOS 27 and GitHub's
# runner images carry Xcode 26 at the newest, so this cannot compile the
# project at all; a deployment target may not exceed the SDK building it.
# To restore once a 27 image exists: put back the push/pull_request triggers
# below, and move runs-on and the Xcode-selection step from 26 to 27.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          # macos-26 runners carry several Xcode 26.x patch releases side by
          # side; pick the newest rather than pinning a patch version that
          # will eventually be pruned from the image.
          XCODE_PATH="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner image (checked /Applications/Xcode_26*.app)"
            find /Applications -maxdepth 1 -iname "*xcode*"
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build (macOS)
        run: |
          xcodebuild -project Firnlight.xcodeproj -scheme Firnlight \
            -configuration Debug -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build (iOS Simulator)
        run: |
          xcodebuild -project Firnlight.xcodeproj -scheme Firnlight \
            -configuration Debug -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
