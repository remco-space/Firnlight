<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The alpenglow itself — the low red-pink light catching the peaks, which is
    what the app is named after. Topmost layer (see ../icon.json, group
    "Alpenglow").

    Each triangle is the west face of one summit in range.svg: bounded above by
    that summit's left edge, on the right by the ridge line falling from its
    apex, and cut off below by the shadow line the rising night draws across a
    mountain at dusk. Only the west faces are lit, which is what places the
    light source to the left — the same side moon.svg sits on.

    Main peak: apex (400,235) down its left edge to (190,650), back up the
    ridge at x=400. Shoulder: apex (700,345) down to the saddle (560,490).
    Both are cut against range.svg's vertices and lie strictly inside it, so
    the two files have to move together.

    The main triangle stops at y=650 rather than following the flank all the
    way to the base: a lit face reaching the ground reads as a two-tone
    pyramid, not as light on a summit. It is nonetheless as large as it is
    because these two triangles are the whole subject at 16pt, where the
    silhouette alone is an undifferentiated dark mass.
  -->
  <path d="M 400,235 L 190,650 L 400,650 Z" fill="#FFFFFF"/>
  <path d="M 700,345 L 560,490 L 700,490 Z" fill="#FFFFFF"/>
</svg>
