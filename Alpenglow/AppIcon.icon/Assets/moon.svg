<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The moon, sitting partly behind the mountain. Bottom-most group in
    ../icon.json, so range.svg draws over it and the ridge line cuts across the
    disc — that occlusion is the whole point: it is what turns the stack of
    groups into visible depth rather than layers that merely happen to overlap.

    Centre (310,290) r=125 is chosen against range.svg's left flank, which runs
    from the summit (400,235) down to (0,1024). The flank crosses this circle,
    so roughly its right third is hidden and the rest stands clear in open sky.
    Move either shape and the overlap has to be re-checked.

    It is a plain disc on purpose. Craters would need either extra layers or
    transparent holes that let the sky through, and neither survives being
    drawn at 16pt, where this reads as a single bright dot above a dark mass.

    Sun or moon is one colour: this file is geometry only, and what makes it a
    moon is the cool near-white fill on its layer in ../icon.json. Warming that
    fill back to gold turns it into a sun again with no change here.
  -->
  <circle cx="310" cy="290" r="125" fill="#FFFFFF"/>
</svg>
