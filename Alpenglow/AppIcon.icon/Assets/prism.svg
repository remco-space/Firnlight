<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The prism: the moon's light split into a spectrum and bent over the summit.
    Topmost group in ../icon.json, where `refractivity` and `blur-material` do
    the optical work — this composition is the icon's demonstration of FR-8.6's
    "light bending and blurring as it passes through the glass", so those group
    settings are the effect and these ribbons are only the shape they act on.

    Curved, not radial. Straight rays from a point read as a sunburst — emission,
    not refraction — so each band is a quadratic arc: it rises from beside the
    moon, bends over the main summit at (400,235), and falls away down the right
    flank. That single curve carries both halves of the brief at once, passing
    *through* the peak where it crosses the silhouette and *around* it where it
    clears the ridge.

    The five bands touch rather than sitting apart, so the group is one ribbon
    divided into five colours instead of five separate ribbons. That is a
    small-size decision: separated bands blurred into an unreadable smear at
    16pt, while a single contiguous arc still resolves as one shape there and
    only reveals the spectrum when drawn large.

    Colours live here rather than in a layer `fill`, because a layer takes one
    fill and a spectrum needs five. They run warm to cool along the sweep, so
    the ribbon still reads as light once hue is stripped — in the tinted and
    clear appearances only that luminance ramp survives.
  -->
  <path d="M 286.0,296 Q 458.0,6 1190.0,330 L 1190.0,392 Q 458.0,22 286.0,308 Z" fill="#FFE9B8" fill-opacity="0.52"/>
  <path d="M 286.0,308 Q 458.0,22 1190.0,392 L 1190.0,454 Q 458.0,38 286.0,320 Z" fill="#FFC79A" fill-opacity="0.52"/>
  <path d="M 286.0,320 Q 458.0,38 1190.0,454 L 1190.0,516 Q 458.0,54 286.0,332 Z" fill="#FF9DAE" fill-opacity="0.52"/>
  <path d="M 286.0,332 Q 458.0,54 1190.0,516 L 1190.0,578 Q 458.0,70 286.0,344 Z" fill="#CE93EA" fill-opacity="0.52"/>
  <path d="M 286.0,344 Q 458.0,70 1190.0,578 L 1190.0,640 Q 458.0,86 286.0,356 Z" fill="#86B9F2" fill-opacity="0.52"/>
</svg>
